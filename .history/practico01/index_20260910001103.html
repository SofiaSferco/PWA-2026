<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practico 01</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1>Nombre: {{nombre}}</h1>
        <h1>Edad: {{edad}}</h1>
        <h1>Nombre: {{ciudad}}</h1>
        <h1>Hola, mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}}.</h1>
    </div>
    <script>
       var app= new Vue({
           el: '#app',
           data: {
               nombre: 'Sofia Sferco',
               edad: 33,
               ciudad: 'Viedma',
           }
       })
    </script>
</body>
</html>
