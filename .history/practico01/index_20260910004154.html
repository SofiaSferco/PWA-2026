<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practico 01</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <p>
            <h1>TRABAJO PRACTICO N°1</h1> 
        </p>
        <hr>
        <h1>Paso #1 – Creación repositorio</h1>
        <hr>
        <h1>Paso #2 - Información de Perfil Simple (Interpolación)</h1>
        <h2>Nombre: {{nombre}}</h2>
        <h2>Edad: {{edad}}</h2>
        <h2>Ciudad: {{ciudad}}</h2>
        <h1>Hola, mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}}.</h1>
        <hr>
        <h1>Paso #3 – Contador Interactivo (Interpolación y Eventos)</h1>
        <button v-on:click="aumentar" Aumentar en 1></button>
    </div>
    <script>
       var app= new Vue({
           el: '#app',
           data: {
               nombre: 'Sofia Sferco',
               edad: 33,
               ciudad: 'Viedma',
               contador: 0,
           },
            methods: {
               aumentar: function() {
                    this.contador++;
               },
           }
       })
    </script>
</body>
</html>
